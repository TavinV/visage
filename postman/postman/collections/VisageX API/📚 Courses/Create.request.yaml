$kind: http-request
url: "{{baseUrl}}/courses"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "academicPeriodId": "{{createdAcademicPeriodId}}",
      "name": "Engenharia de Software"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const { data } = pm.response.json();
      pm.collectionVariables.set('createdCourseId', data.id);
      console.log('[Courses] createdCourseId =', data.id);
    language: text/javascript
order: 2000
