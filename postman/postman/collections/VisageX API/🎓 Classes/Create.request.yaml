$kind: http-request
url: "{{baseUrl}}/classes"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "courseId": "{{createdCourseId}}",
      "name": "ES — Turma A (Noite)",
      "teacherId": "{{createdUserId}}",
      "room": "A-102",
      "locationId": "{{createdLocationId}}",
      "totalClassesPlanned": 60
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const { data } = pm.response.json();
      pm.collectionVariables.set('createdClassId', data.id);
      console.log('[Classes] createdClassId =', data.id);
    language: text/javascript
order: 2000
