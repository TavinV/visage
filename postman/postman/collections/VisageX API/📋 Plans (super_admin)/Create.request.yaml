$kind: http-request
url: "{{baseUrl}}/plans"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "name": "Plano Demo",
      "maxClasses": 30,
      "priceMonthly": 199.90
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('201 Created', () => pm.response.to.have.status(201));
      const { data } = pm.response.json();
      pm.collectionVariables.set('createdPlanId', data.id);
      console.log('[Plans] createdPlanId =', data.id);
    language: text/javascript
order: 3000
