$kind: http-request
name: Login — Super Admin
description: |-
  Faz login com o Super Admin do bootstrap (env `SUPER_ADMIN_EMAIL`/`SUPER_ADMIN_PASSWORD`).

  Salva nas variáveis: `accessToken`, `refreshToken`, `tenantId`, `userId`, `currentRole`, `superAdminAccessToken`, `superAdminRefreshToken`.
url: "{{baseUrl}}/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{superAdminEmail}}",
      "password": "{{superAdminPassword}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const { data } = pm.response.json();
      pm.collectionVariables.set('accessToken', data.accessToken);
      pm.collectionVariables.set('refreshToken', data.refreshToken);
      pm.collectionVariables.set('tenantId', data.user.tenantId);
      pm.collectionVariables.set('userId', data.user.id);
      pm.collectionVariables.set('currentRole', data.user.role);
      pm.collectionVariables.set('superAdminAccessToken', data.accessToken);
      pm.collectionVariables.set('superAdminRefreshToken', data.refreshToken);
      console.log('[Auth] Logado como super_admin:', data.user.email);
    language: text/javascript
order: 1000
