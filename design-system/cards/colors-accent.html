<!-- @dsCard group="Colors" viewport="700x170" name="Accent — Controlled Blue" subtitle="Rationed: links, active states, focus, single indicators only" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 84px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; }
  .name { font-size: 12px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; margin-top: 2px; }
  .note { margin-top: 12px; font-size: 12px; color: var(--text-muted); display: flex; align-items: center; gap: 8px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--accent-050);color:var(--navy-900)"><span class="name">accent-050</span><span class="hex">#EEF3FF</span></div>
    <div class="sw" style="background:var(--accent-100);color:var(--navy-900)"><span class="name">accent-100</span><span class="hex">#DBE6FE</span></div>
    <div class="sw" style="background:var(--accent-500);color:#fff"><span class="name">accent-500</span><span class="hex">#3B82F6</span></div>
    <div class="sw" style="background:var(--accent-600);color:#fff"><span class="name">accent-600</span><span class="hex">#2563EB</span></div>
    <div class="sw" style="background:var(--accent-700);color:#fff"><span class="name">accent-700</span><span class="hex">#1D4ED8</span></div>
  </div>
  <div class="note"><span class="dot"></span> Use sparingly — the accent must never dominate the interface.</div>
</body>
</html>
