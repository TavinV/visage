<!-- @dsCard group="Colors" viewport="700x150" name="Primary — Institutional Navy" subtitle="Authority color: headers, hero panels, dark sections" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; color: #fff; }
  .name { font-family: var(--font-sans); font-size: 12px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.7; margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--navy-950)"><span class="name">navy-950</span><span class="hex">#080D18</span></div>
    <div class="sw" style="background:var(--navy-900)"><span class="name">navy-900</span><span class="hex">#0B1220</span></div>
    <div class="sw" style="background:var(--navy-800)"><span class="name">navy-800</span><span class="hex">#101A2D</span></div>
    <div class="sw" style="background:var(--navy-700)"><span class="name">navy-700</span><span class="hex">#13213A</span></div>
    <div class="sw" style="background:var(--navy-600)"><span class="name">navy-600</span><span class="hex">#1B2C4D</span></div>
    <div class="sw" style="background:var(--navy-500)"><span class="name">navy-500</span><span class="hex">#25395F</span></div>
  </div>
</body>
</html>
