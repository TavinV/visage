services:
  face-engine:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartface-engine
    ports:
      - "8001:8001"
    environment:
      - AES_KEY=${AES_KEY}
      - ENGINE_API_KEY=${ENGINE_API_KEY}
      - RECOGNITION_THRESHOLD=${RECOGNITION_THRESHOLD:-1.10}
      - LIVENESS_THRESHOLD=${LIVENESS_THRESHOLD:-0.85}
      - LIVENESS_MODEL_PATH=/app/models/minifas.onnx
      - PORT=8001
    volumes:
      - ./models:/app/models
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
