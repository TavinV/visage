[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short --strict-markers -m "not integration and not models"
markers =
    unit: puro (numpy/cryptography) — roda em qualquer máquina, sem I/O
    integration: exige a engine no ar (ENGINE_API_KEY + ENGINE_BASE_URL)
    models: exige os modelos ONNX carregados (roda no container)
    slow: demorado; fora do ciclo rápido

; Tiers:
;   py -3 -m pytest                      -> só o tier puro (padrão)
;   py -3 -m pytest -m integration       -> contra a engine viva
;   py -3 -m pytest -m models            -> pipeline completo com ONNX
