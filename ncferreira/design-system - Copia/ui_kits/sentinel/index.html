<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentinel — by Flauzino</title>
<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="kit.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;}#root{height:100%;}</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" data-presets="react" src="Icons.jsx"></script>
<script type="text/babel" data-presets="react" src="data.js"></script>
<script type="text/babel" data-presets="react" src="Sidebar.jsx"></script>
<script type="text/babel" data-presets="react" src="Topbar.jsx"></script>
<script type="text/babel" data-presets="react" src="Dashboard.jsx"></script>
<script type="text/babel" data-presets="react" src="Identities.jsx"></script>
<script type="text/babel" data-presets="react" src="Login.jsx"></script>

<script type="text/babel">
function App() {
  const [authed, setAuthed] = React.useState(false);
  const [page, setPage] = React.useState("dashboard");

  if (!authed) {
    return React.createElement(window.SentinelLogin, { onLogin: () => setAuthed(true) });
  }

  const Screen = page === "identities" ? window.SentinelIdentities : window.SentinelDashboard;
  return (
    <div className="sx-app">
      {React.createElement(window.SentinelSidebar, {
        page,
        onNavigate: (k) => setPage(k === "events" || k === "access" || k === "settings" ? "dashboard" : k),
        onLogout: () => setAuthed(false),
      })}
      <div className="sx-main">
        <Screen />
      </div>
    </div>
  );
}

function boot() {
  if (!window.SentinelLogin || !window.SentinelDashboard || !window.FlauzinoDesignSystem_b9b227) {
    return setTimeout(boot, 30);
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
}
boot();
</script>
</body>
</html>
