<!-- @dsCard group="Colors" viewport="700x150" name="Neutral — Cool Slate Ramp" subtitle="Surfaces, text, borders — tuned toward navy" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); border: 1px solid var(--border-subtle); }
  .sw { flex: 1; height: 92px; display: flex; flex-direction: column; justify-content: flex-end; padding: 8px; }
  .name { font-size: 11px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 10px; opacity: 0.7; margin-top: 1px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--white);color:var(--navy-900)"><span class="name">white</span><span class="hex">#FFFFFF</span></div>
    <div class="sw" style="background:var(--slate-50);color:var(--navy-900)"><span class="name">50</span></div>
    <div class="sw" style="background:var(--slate-100);color:var(--navy-900)"><span class="name">100</span></div>
    <div class="sw" style="background:var(--slate-200);color:var(--navy-900)"><span class="name">200</span></div>
    <div class="sw" style="background:var(--slate-300);color:var(--navy-900)"><span class="name">300</span></div>
    <div class="sw" style="background:var(--slate-400);color:var(--navy-900)"><span class="name">400</span></div>
    <div class="sw" style="background:var(--slate-500);color:#fff"><span class="name">500</span></div>
    <div class="sw" style="background:var(--slate-600);color:#fff"><span class="name">600</span></div>
    <div class="sw" style="background:var(--slate-700);color:#fff"><span class="name">700</span></div>
    <div class="sw" style="background:var(--slate-800);color:#fff"><span class="name">800</span></div>
    <div class="sw" style="background:var(--slate-900);color:#fff"><span class="name">900</span></div>
  </div>
</body>
</html>
