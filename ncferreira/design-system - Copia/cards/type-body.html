<!-- @dsCard group="Type" viewport="700x190" name="Body, Labels & Eyebrow" subtitle="Sentence case body; uppercase only for kickers" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 26px; background: var(--surface-card); display: flex; flex-direction: column; gap: 14px; }
  .label { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); }
  .block { display: flex; flex-direction: column; gap: 4px; }
  p.fl-body { max-width: 560px; }
</style>
</head>
<body>
  <div class="block">
    <span class="label">.fl-eyebrow — 600 · uppercase · 0.14em</span>
    <span class="fl-eyebrow">Reconhecimento facial</span>
  </div>
  <div class="block">
    <span class="label">.fl-body — 400 · 16px · 1.65</span>
    <p class="fl-body">Desenvolvemos plataformas corporativas e soluções críticas de negócio, com foco em segurança, estabilidade e continuidade operacional.</p>
  </div>
  <div class="block">
    <span class="label">.fl-small — 14px · muted</span>
    <span class="fl-small">Identidade verificada em menos de 300ms.</span>
  </div>
</body>
</html>
