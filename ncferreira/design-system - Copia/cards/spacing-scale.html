<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing Scale — 4px grid" subtitle="Predictable rhythm signals engineering rigor" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 26px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: flex; align-items: flex-end; gap: 18px; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .bar { background: var(--accent-600); width: 22px; border-radius: 2px; }
  .tok { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .px { font-size: 10px; color: var(--text-faint); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><span class="tok">space-1</span><span class="px">4</span></div>
    <div class="item"><div class="bar" style="height:8px"></div><span class="tok">space-2</span><span class="px">8</span></div>
    <div class="item"><div class="bar" style="height:12px"></div><span class="tok">space-3</span><span class="px">12</span></div>
    <div class="item"><div class="bar" style="height:16px"></div><span class="tok">space-4</span><span class="px">16</span></div>
    <div class="item"><div class="bar" style="height:24px"></div><span class="tok">space-5</span><span class="px">24</span></div>
    <div class="item"><div class="bar" style="height:32px"></div><span class="tok">space-6</span><span class="px">32</span></div>
    <div class="item"><div class="bar" style="height:40px"></div><span class="tok">space-7</span><span class="px">40</span></div>
    <div class="item"><div class="bar" style="height:48px"></div><span class="tok">space-8</span><span class="px">48</span></div>
    <div class="item"><div class="bar" style="height:64px"></div><span class="tok">space-9</span><span class="px">64</span></div>
    <div class="item"><div class="bar" style="height:80px"></div><span class="tok">space-10</span><span class="px">80</span></div>
  </div>
</body>
</html>
