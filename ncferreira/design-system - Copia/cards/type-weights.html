<!-- @dsCard group="Type" viewport="700x150" name="Weights" subtitle="400 body · 500 labels/UI · 600 headings · 700 display" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 26px; background: var(--surface-card); font-family: var(--font-sans); }
  .row { display: flex; gap: 28px; align-items: baseline; }
  .item { display: flex; flex-direction: column; gap: 2px; }
  .big { font-size: 34px; color: var(--text-strong); letter-spacing: -0.015em; }
  .cap { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><span class="big" style="font-weight:400">Aa</span><span class="cap">Regular 400</span></div>
    <div class="item"><span class="big" style="font-weight:500">Aa</span><span class="cap">Medium 500</span></div>
    <div class="item"><span class="big" style="font-weight:600">Aa</span><span class="cap">Semibold 600</span></div>
    <div class="item"><span class="big" style="font-weight:700">Aa</span><span class="cap">Bold 700</span></div>
  </div>
</body>
</html>
