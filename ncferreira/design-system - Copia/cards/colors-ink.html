<!-- @dsCard group="Colors" viewport="700x150" name="Secondary — Sophisticated Black" subtitle="Authority & exclusivity: the most serious moments" -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); }
  .row { display: flex; gap: 0; border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .sw { flex: 1; height: 96px; display: flex; flex-direction: column; justify-content: flex-end; padding: 10px; color: #fff; }
  .name { font-family: var(--font-sans); font-size: 12px; font-weight: 600; }
  .hex { font-family: var(--font-mono); font-size: 11px; opacity: 0.65; margin-top: 2px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--ink-950)"><span class="name">ink-950</span><span class="hex">#050505</span></div>
    <div class="sw" style="background:var(--ink-900)"><span class="name">ink-900</span><span class="hex">#0A0A0A</span></div>
    <div class="sw" style="background:var(--ink-800)"><span class="name">ink-800</span><span class="hex">#111111</span></div>
    <div class="sw" style="background:var(--ink-700)"><span class="name">ink-700</span><span class="hex">#1A1A1A</span></div>
  </div>
</body>
</html>
