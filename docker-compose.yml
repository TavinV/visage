services:

  # ── PostgreSQL 16 ──────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: visage-db
    env_file:
      - ./db/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # SQL de init — executado pelo Postgres na primeira inicialização
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Redis 7 ────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: visage-redis
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Face Engine (Python/FastAPI) ───────────────────────────────────────────
  face-engine:
    build:
      context: ./face_engine
      dockerfile: Dockerfile
    container_name: visage-face-engine
    env_file:
      - ./face_engine/.env
    environment:
      # A imagem (Dockerfile + config.py) nasce com default seguro para 1
      # vCPU (o deploy de produção atual). Este compose roda com cota de 2
      # CPUs (ver deploy.resources abaixo) — sobrescrevemos aqui para
      # aproveitar o segundo núcleo só no ambiente local. Ver docs/PERFORMANCE.md.
      ONNX_INTRA_OP_THREADS: "1" # mantém 1 mesmo com 2 CPUs — cauda melhor (ver docs)
      ONNX_INTER_OP_THREADS: "1"
      CV2_NUM_THREADS: "2"
      ENGINE_THREAD_POOL_SIZE: "2"
      OMP_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      NUMEXPR_NUM_THREADS: "2"
    ports:
      - "8001:8001"
    volumes:
      # modelos ONNX — read-only para evitar sobrescrita acidental
      - ./face_engine/models:/app/models:ro
      # frames de fraude (liveness_failed) — volume nomeado persistente
      - fraud_frames:/app/fraud_frames
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G
        reservations:
          cpus: "1"
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    driver: local
  fraud_frames:
    driver: local

networks:
  default:
    name: visage-network
